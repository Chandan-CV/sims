# Opts workmanager into the `dataSync` foreground service type for the
# "Run in background" indexing task (see BackgroundIndexService). Without
# this, workmanager's default manifest only declares `shortService`, and a
# `dataSync` ForegroundServiceConfig would crash at runtime with a
# MissingForegroundServiceTypeException.
workmanager.enableDataSyncForegroundService=true
